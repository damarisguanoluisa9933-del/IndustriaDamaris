{% extends '../plantilla.html' %}
{% block contenido %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card shadow border-0">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Editar Órden de Fabricación</h4>
                </div>
                <div class="card-body">
                    <form id="frm_editar_orden" action="{% url 'editar_orden' orden.id %}" method="post">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><b>Código de Lote:</b></label>
                                <input type="text" class="form-control" id="codigo_lote" name="codigo_lote" value="{{ orden.codigo_lote }}" placeholder="Ej: LOT-001">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><b>Producto a Fabricar:</b></label>
                                <input type="text" class="form-control" id="producto" name="producto" value="{{ orden.producto }}" placeholder="Ej: Botellas Plásticas 500ml">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><b>Línea de Ensamblaje:</b></label>
                                <select class="form-select" id="linea_id" name="linea_id">
                                    {% for linea in lineas %}
                                        <option value="{{ linea.id }}" {% if orden.linea.id == linea.id %}selected{% endif %}>{{ linea.nombre }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><b>Máquina Asignada:</b></label>
                                <select class="form-select" id="maquina_id" name="maquina_id">
                                    <option value="">-- Sin Asignar --</option>
                                    {% for maquina in maquinas %}
                                        <option value="{{ maquina.id }}" {% if orden.maquina and orden.maquina.id == maquina.id %}selected{% endif %}>{{ maquina.nombre }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><b>Supervisor Encargado:</b></label>
                                {% if not user.is_superuser %}
                                    <input type="text" class="form-control" value="{{ orden.supervisor.nombre }} {{ orden.supervisor.apellido }}" readonly>
                                    <input type="hidden" name="supervisor_id" value="{{ orden.supervisor.id }}">
                                {% else %}
                                    <select class="form-select" id="supervisor_id" name="supervisor_id">
                                        {% for supervisor in supervisores %}
                                            <option value="{{ supervisor.id }}" {% if orden.supervisor.id == supervisor.id %}selected{% endif %}>{{ supervisor.nombre }} {{ supervisor.apellido }}</option>
                                        {% endfor %}
                                    </select>
                                {% endif %}
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><b>Operario Principal:</b></label>
                                <select class="form-select" id="operario_id" name="operario_id">
                                    <option value="">-- Sin Asignar --</option>
                                    {% for operario in operarios %}
                                        <option value="{{ operario.id }}" {% if orden.operario_encargado and orden.operario_encargado.id == operario.id %}selected{% endif %}>{{ operario.nombres }} {{ operario.apellidos }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <!-- MATERIA PRIMA CON VALIDACIÓN DE STOCK -->
                        <hr class="my-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="text-primary fw-bold mb-0"><i class="bi bi-box-seam me-2"></i>Materia Prima Asignada</h5>
                            <span id="badge_stock_info" class="badge bg-secondary p-2 d-none">Stock Disponible: <b id="lbl_stock">0</b></span>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label"><b>Materia Prima:</b></label>
                                <select class="form-select" id="select_insumo" name="insumo_id">
                                    <option value="" data-stock="0">-- Seleccionar --</option>
                                    {% for insumo in insumos %}
                                        <option value="{{ insumo.id }}" data-stock="{{ insumo.stock_disponible }}" data-unidad="{{ insumo.unidad_medida }}" {% if detalle_insumo and detalle_insumo.insumo.id == insumo.id %}selected{% endif %}>
                                            {{ insumo.nombre }} (Stock: {{ insumo.stock_disponible }} {{ insumo.unidad_medida }})
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label"><b>Cantidad Estimada:</b></label>
                                <input type="number" step="0.01" min="0.01" class="form-control" id="input_estimada" name="cantidad_estimada" value="{{ detalle_insumo.cantidad_estimada|default:0 }}" placeholder="Ej: 100.00">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label"><b>Cantidad Utilizada:</b></label>
                                <input type="number" step="0.01" min="0.01" class="form-control" id="input_utilizada" name="cantidad_utilizada" value="{{ detalle_insumo.cantidad_utilizada|default:0 }}" placeholder="Ej: 105.50">
                            </div>
                        </div>

                        <hr class="my-4">
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label"><b>Cant. Programada:</b></label>
                                <input type="number" min="1" class="form-control" name="cantidad_programada" value="{{ orden.cantidad_programada }}" placeholder="Ej: 5000">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label"><b>Cant. Producida:</b></label>
                                <input type="number" min="0" class="form-control" name="cantidad_producida" value="{{ orden.cantidad_producida }}" placeholder="Ej: 4950">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label"><b>Estado:</b></label>
                                <select class="form-select" name="estado">
                                    <option value="Pendiente" {% if orden.estado == 'Pendiente' %}selected{% endif %}>Pendiente</option>
                                    <option value="En Proceso" {% if orden.estado == 'En Proceso' %}selected{% endif %}>En Proceso</option>
                                    <option value="Pausada" {% if orden.estado == 'Pausada' %}selected{% endif %}>Pausada</option>
                                    <option value="Finalizada" {% if orden.estado == 'Finalizada' %}selected{% endif %}>Finalizada</option>
                                    <option value="Cancelada" {% if orden.estado == 'Cancelada' %}selected{% endif %}>Cancelada</option>
                                </select>
                            </div>
                        </div>

                        <!-- FECHAS LIMITADAS MÁXIMO A 6 MESES -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><b>Fecha/Hora Inicio Programada:</b></label>
                                <input type="datetime-local" class="form-control" id="fecha_inicio_programada" name="fecha_inicio_programada" value="{{ orden.fecha_inicio_programada|date:'Y-m-d\TH:i' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><b>Fecha/Hora Estimada Fin:</b></label>
                                <input type="datetime-local" class="form-control" id="fecha_fin_programada" name="fecha_fin_programada" value="{{ orden.fecha_fin_programada|date:'Y-m-d\TH:i' }}">
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'listado_ordenes' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-warning">
                                <i class="bi bi-arrow-repeat me-1"></i>Actualizar Lote
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {

    // CÁLCULO DE FECHA MÁXIMA EN 6 MESES
    const fechaLimite6Meses = new Date();
    fechaLimite6Meses.setMonth(fechaLimite6Meses.getMonth() + 6);
    const formatearFechaLocal = (fecha) => {
        const yyyy = fecha.getFullYear();
        const mm = String(fecha.getMonth() + 1).padStart(2, '0');
        const dd = String(fecha.getDate()).padStart(2, '0');
        const hh = String(fecha.getHours()).padStart(2, '0');
        const mi = String(fecha.getMinutes()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}T${hh}:${mi}`;
    };
    const fechaMaxStr = formatearFechaLocal(fechaLimite6Meses);

    $('#fecha_inicio_programada, #fecha_fin_programada').attr('max', fechaMaxStr);

    $.validator.addMethod("productoReal", function(value, element) {
        var texto = $.trim(value);
        if (this.optional(element)) return true;
        if (!/^[a-zA-Z0-9áéíóúÁÉÍÓÚñÑ\s\-\(\)]+$/.test(texto)) return false;
        if (!/[a-zA-ZáéíóúÁÉÍÓÚñÑ]/.test(texto)) return false;
        if (/^\d+$/.test(texto)) return false;
        if (/(.)\1{3,}/.test(texto)) return false;
        return true;
    }, "Ingrese un nombre de producto válido.");

    $.validator.addMethod("codigoMixto", function(value, element) {
        var cod = $.trim(value);
        if (this.optional(element)) return true;
        if (!/^[a-zA-Z0-9\-_]+$/.test(cod)) return false;
        return /[a-zA-Z]/.test(cod);
    }, "El código no puede ser solo números.");

    $.validator.addMethod("maximo6Meses", function(value, element) {
        if (!value) return true;
        return new Date(value) <= fechaLimite6Meses;
    }, "La fecha programada no puede superar los 6 meses.");

    $("#frm_editar_orden").validate({
        ignore: [],
        rules: {
            codigo_lote: { required: true, minlength: 3, maxlength: 20, codigoMixto: true },
            producto: { required: true, minlength: 3, maxlength: 150, productoReal: true },
            linea_id: { required: true },
            supervisor_id: { required: true },
            insumo_id: { required: true },
            cantidad_estimada: { required: true, number: true, min: 0.01 },
            cantidad_utilizada: { required: true, number: true, min: 0.01 },
            cantidad_programada: { required: true, digits: true, min: 1 },
            cantidad_producida: { required: true, digits: true, min: 0 },
            fecha_inicio_programada: { maximo6Meses: true },
            fecha_fin_programada: { maximo6Meses: true }
        },
        messages: {
            codigo_lote: { required: "El código de lote es obligatorio." },
            producto: { required: "Ingrese el nombre del producto." },
            linea_id: { required: "Seleccione una línea de ensamblaje." },
            supervisor_id: { required: "Seleccione un supervisor." },
            insumo_id: { required: "Seleccione un insumo." },
            cantidad_estimada: { required: "Ingrese la cantidad estimada.", min: "Mínimo 0.01." },
            cantidad_utilizada: { required: "Ingrese la cantidad utilizada.", min: "Mínimo 0.01." },
            cantidad_programada: { required: "Ingrese las unidades programadas.", min: "Mínimo 1 unidad." },
            cantidad_producida: { required: "Ingrese las unidades producidas.", min: "No puede ser negativo." }
        },
        errorElement: 'label',
        errorClass: 'error text-danger fw-bold mt-1 d-block',
        highlight: function(element) {
            $(element).addClass('is-invalid error').removeClass('is-valid');
        },
        unhighlight: function(element) {
            $(element).removeClass('is-invalid error').addClass('is-valid');
        }
    });

    function actualizarReglasStock() {
        let opcionSeleccionada = $('#select_insumo').find(':selected');
        let stockDisponible = parseFloat(opcionSeleccionada.data('stock')) || 0;
        let unidad = opcionSeleccionada.data('unidad') || '';

        if ($('#select_insumo').val() !== '') {
            $('#badge_stock_info').removeClass('d-none');
            $('#lbl_stock').text(`${stockDisponible} ${unidad}`);

            $('#input_estimada').rules('add', {
                max: stockDisponible,
                messages: { max: `Excede el stock disponible (${stockDisponible} ${unidad})` }
            });

            $('#input_utilizada').rules('add', {
                max: stockDisponible,
                messages: { max: `Excede el stock disponible (${stockDisponible} ${unidad})` }
            });
        }
    }

    actualizarReglasStock();
    $('#select_insumo').on('change', actualizarReglasStock);
});
</script>
{% endblock %}
