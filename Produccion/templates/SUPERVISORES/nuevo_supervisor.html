{% extends '../plantilla.html' %}
{% load static %}

{% block contenido %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-person-badge me-2"></i>Registrar Supervisor</h4>
                </div>
                <div class="card-body">
                    <form id="frm_supervisor" action="{% url 'nuevo_supervisor' %}" method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <!-- Cédula -->
                        <div class="mb-3">
                            <label class="form-label"><b>Cédula Ecuatoriana:</b></label>
                            <input type="text" class="form-control" name="cedula" id="cedula" maxlength="10" placeholder="Ej: 0501234567">
                        </div>

                        <!-- Nombre y Apellido -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><b>Nombre:</b></label>
                                <input type="text" class="form-control" name="nombre" id="nombre" placeholder="Nombres completos">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><b>Apellido:</b></label>
                                <input type="text" class="form-control" name="apellido" id="apellido" placeholder="Apellidos completos">
                            </div>
                        </div>

                        <!-- Correo -->
                        <div class="mb-3">
                            <label class="form-label"><b>Correo Electrónico:</b></label>
                            <input type="email" class="form-control" name="correo" id="correo" placeholder="correo@ejemplo.com">
                        </div>

                        <!-- Contraseña -->
                        <div class="mb-3">
                            <label class="form-label"><b>Contraseña:</b></label>
                            <input type="password" class="form-control" name="contrasena" id="contrasena" placeholder="Mínimo 6 caracteres">
                        </div>

                        <!-- Foto de Perfil -->
                        <div class="mb-3">
                            <label class="form-label"><b>Foto de Perfil:</b></label>
                            <input type="file" id="foto_supervisor" name="foto" accept="image/*">
                        </div>

                        <!-- Botones -->
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'listado_supervisores' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i>Guardar Supervisor
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    // 1. Método personalizado para validar la extensión de imagen (impide PDFs)
    $.validator.addMethod("extensionImagen", function(value, element) {
        if (this.optional(element) || !element.files || element.files.length === 0) {
            return false; // Retorna false si no hay archivo seleccionado
        }
        var file = element.files[0];
        var extensionesPermitidas = ["jpg", "jpeg", "png", "webp"];
        var ext = file.name.split('.').pop().toLowerCase();
        
        return $.inArray(ext, extensionesPermitidas) !== -1;
    }, "Solo se permiten imágenes (JPG, JPEG, PNG, WEBP). No se permiten archivos PDF u otros formatos.");

    // 2. Inicializar Bootstrap FileInput
    $("#foto_supervisor").fileinput({ 
        language: 'es', 
        showUpload: false, 
        dropZoneEnabled: true, 
        maxFileCount: 1,
        allowedFileTypes: ['image'],
        allowedFileExtensions: ['jpg', 'jpeg', 'png', 'webp']
    });

    // Validar en tiempo real si seleccionan o quitan el archivo en FileInput
    $('#foto_supervisor').on('change fileclear filecleared', function() {
        $("#frm_supervisor").validate().element("#foto_supervisor");
    });

    // 3. Reglas de Validación con jQuery Validate
    $("#frm_supervisor").validate({
        errorElement: 'label',
        errorClass: 'error',
        rules: {
            cedula: { 
                required: true, 
                digits: true, 
                minlength: 10,
                maxlength: 10,
                cedulaEcuador: true 
            },
            nombre: { 
                required: true, 
                soloLetras: true,
                minlength: 2 
            },
            apellido: { 
                required: true, 
                soloLetras: true,
                minlength: 2 
            },
            correo: { 
                required: true, 
                email: true 
            },
            contrasena: { 
                required: true, 
                minlength: 6 
            },
            foto: {
                required: true,       // Obliga a subir un archivo para poder guardar
                extensionImagen: true // Obliga a que el archivo sea una imagen válida
            }
        },
        messages: {
            cedula: {
                required: "La cédula es obligatoria.",
                digits: "Ingrese únicamente números sin guiones ni espacios.",
                minlength: "La cédula debe contener exactamente 10 dígitos.",
                maxlength: "La cédula debe contener exactamente 10 dígitos."
            },
            nombre: {
                required: "El nombre es obligatorio.",
                minlength: "El nombre debe tener al menos 2 caracteres."
            },
            apellido: {
                required: "El apellido es obligatorio.",
                minlength: "El apellido debe tener al menos 2 caracteres."
            },
            correo: {
                required: "El correo electrónico es obligatorio.",
                email: "Ingrese un correo electrónico válido (ejemplo: usuario@dominio.com)."
            },
            contrasena: {
                required: "La contraseña es obligatoria.",
                minlength: "La contraseña debe tener al menos 6 caracteres."
            },
            foto: {
                required: "Debe seleccionar una foto de perfil obligatoriamente.",
                extensionImagen: "Formato no permitido. Seleccione una imagen (JPG, PNG, WEBP)."
            }
        },
        errorPlacement: function (error, element) {
            if (element.attr("name") === "foto") {
                // Muestra la etiqueta error justo debajo del contenedor del FileInput
                error.insertAfter(element.closest('.mb-3'));
            } else {
                error.insertAfter(element);
            }
        }
    });
});
</script>
{% endblock %}
