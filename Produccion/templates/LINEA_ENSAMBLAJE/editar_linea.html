{% extends '../plantilla.html' %}
{% block contenido %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Editar Línea de Ensamblaje</h4>
                </div>
                <div class="card-body">
                    <form id="frm_editar_linea" action="{% url 'editar_linea' linea.id %}" method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label" for="nombre"><b>Nombre de la Línea:</b></label>
                            <input type="text" class="form-control" id="nombre" name="nombre" value="{{ linea.nombre }}">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label" for="codigo"><b>Código Identificador:</b></label>
                            <input type="text" class="form-control" id="codigo" name="codigo" value="{{ linea.codigo }}">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label" for="descripcion"><b>Descripción:</b></label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="3">{{ linea.descripcion }}</textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label" for="foto_linea"><b>Imagen Actual / Reemplazar (Obligatoria):</b></label>
                            <input type="file" id="foto_linea" class="form-control" name="foto" accept="image/jpeg,image/png,image/jpg,image/webp">
                            <div id="error-foto"></div>
                        </div>
                        
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'listado_lineas' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i>Cancelar
                            </a>
                            <button type="submit" id="btn_guardar" class="btn btn-warning">
                                <i class="bi bi-arrow-repeat me-1"></i>Actualizar Línea
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {

    $.validator.addMethod("nombreReal", function(value, element) {
        var texto = $.trim(value);
        if (this.optional(element)) return true;
        if (!/^[a-zA-Z0-9áéíóúÁÉÍÓÚñÑ\s\-\(\)]+$/.test(texto)) return false;
        if (!/[a-zA-ZáéíóúÁÉÍÓÚñÑ]/.test(texto)) return false;
        if (/^\d+$/.test(texto)) return false;
        if (/(.)\1{3,}/.test(texto)) return false;
        return true;
    }, "Ingrese un nombre de línea válido.");

    $.validator.addMethod("codigoMixto", function(value, element) {
        var cod = $.trim(value);
        if (this.optional(element)) return true;
        if (!/^[a-zA-Z0-9\-_]+$/.test(cod)) return false;
        return /[a-zA-Z]/.test(cod);
    }, "El código no puede ser solo números (debe contener letras).");

    $.validator.addMethod("extensionImagen", function(value, element) {
        {% if linea.foto %}
        if (value === "") return true;
        {% endif %}
        return /\.(jpg|jpeg|png|webp)$/i.test(value);
    }, "Formato no permitido. Cargue únicamente archivos de imagen (.jpg, .png, .webp).");

    $("#foto_linea").fileinput({
        language: 'es', 
        showUpload: false, 
        dropZoneEnabled: true, 
        maxFileCount: 1,
        allowedFileTypes: ['image'],
        allowedFileExtensions: ['jpg', 'jpeg', 'png', 'webp'],
        {% if linea.foto %}
        initialPreview: ["<img src='{{ linea.foto.url }}' class='kv-preview-data file-preview-image' style='max-width:100%; max-height:160px;'>"],
        initialPreviewAsData: false,
        {% endif %}
    });

    $("#foto_linea").on('fileloaded filecleared fileselecterror', function() {
        $(this).valid();
    });

    $("#frm_editar_linea").validate({
        ignore: [],
        rules: { 
            nombre: { 
                required: true,
                minlength: 3,
                maxlength: 100,
                nombreReal: true
            }, 
            codigo: { 
                required: true,
                minlength: 3,
                maxlength: 20,
                codigoMixto: true
            },
            descripcion: {
                maxlength: 500
            },
            foto: {
                required: true,       // OBLIGATORIO: No permite guardar si está vacío
                extensionImagen: true // OBLIGATORIO: Bloquea archivos no permitidos como PDF
            }
        },
        messages: {
            nombre: {
                required: "Por favor, ingrese el nombre de la línea."
            },
            codigo: {
                required: "Por favor, ingrese el código identificador."
            },
            descripcion: {
                maxlength: "La descripción no puede superar los 500 caracteres."
            },
            foto: {
                required: "Debe confirmar o reemplazar la foto de la línea.",
                extensionImagen: "Solo se aceptan archivos de imagen (.jpg, .png, .webp)."
            }
        },
        errorElement: 'label',
        errorClass: 'error text-danger fw-bold mt-1 d-block',
        highlight: function(element) {
            $(element).addClass('is-invalid error').removeClass('is-valid');
        },
        unhighlight: function(element) {
            $(element).removeClass('is-invalid error').addClass('is-valid');
        },
        errorPlacement: function(error, element) {
            if (element.attr("name") === "foto") {
                error.appendTo("#error-foto");
            } else {
                error.insertAfter(element);
            }
        }
    });
});
</script>
{% endblock %}
