{% extends '../plantilla.html' %}
{% block contenido %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-diagram-3-fill me-2"></i>Registrar Línea de Ensamblaje</h4>
                </div>
                <div class="card-body">
                    <form id="frm_linea" action="{% url 'nueva_linea' %}" method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label" for="nombre"><b>Nombre de la Línea:</b></label>
                            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej: Línea 1 - Embotellado y Empaque Primario">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label" for="codigo"><b>Código Identificador:</b></label>
                            <input type="text" class="form-control" id="codigo" name="codigo" value="{{ codigo_sugerido }}" placeholder="Ej: LIN-001, LIN-ENV-01">
                            <small class="text-muted">Se asigna un código secuencial estándar, o puede personalizarlo con letras y números.</small>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label" for="descripcion"><b>Descripción:</b></label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="3" placeholder="Ej: Línea automatizada para llenado y etiquetado. Capacidad: 1200 unidades/hora."></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label" for="foto_linea"><b>Imagen de la Línea (Obligatorio):</b></label>
                            <input type="file" id="foto_linea" class="form-control" name="foto" accept="image/jpeg,image/png,image/jpg,image/webp">
                            <div id="error-foto"></div>
                        </div>
                        
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'listado_lineas' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i>Guardar Línea
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    // 1. Regla Nombre Real (Solo letras variadas)
    $.validator.addMethod("nombreReal", function(value, element) {
        var texto = $.trim(value);
        if (this.optional(element)) return true;
        if (!/^[a-zA-Z0-9áéíóúÁÉÍÓÚñÑ\s\-\(\)]+$/.test(texto)) return false;
        if (!/[a-zA-ZáéíóúÁÉÍÓÚñÑ]/.test(texto)) return false; // Al menos una letra
        if (/^\d+$/.test(texto)) return false; // Rechaza si es puro número
        if (/(.)\1{3,}/.test(texto)) return false; // Bloquea letras o números repetidos monótonos
        return true;
    }, "Ingrese un nombre válido que incluya palabras legibles.");

    // 2. Regla Código Mixto (Letras y números combinados, prohíbe puros números)
    $.validator.addMethod("codigoMixto", function(value, element) {
        var cod = $.trim(value);
        if (this.optional(element)) return true;
        if (!/^[a-zA-Z0-9\-_]+$/.test(cod)) return false;
        return /[a-zA-Z]/.test(cod); // OBLIGA a tener al menos una letra
    }, "El código puede incluir números y guiones, pero NO puede ser solo números.");

    // 3. Regla Extensión Imagen
    $.validator.addMethod("extensionImagen", function(value, element) {
        if (this.optional(element)) return true;
        return /\.(jpg|jpeg|png|webp)$/i.test(value);
    }, "Formato no permitido. Cargue únicamente archivos de imagen (.jpg, .png, .webp).");

    // FileInput
    $("#foto_linea").fileinput({ 
        language: 'es', 
        showUpload: false, 
        dropZoneEnabled: true, 
        maxFileCount: 1, 
        allowedFileTypes: ['image'],
        allowedFileExtensions: ['jpg', 'jpeg', 'png', 'webp']
    });

    $("#foto_linea").on('fileloaded filecleared fileselecterror', function() {
        $(this).valid();
    });

    // Validación
    $("#frm_linea").validate({
        ignore: [],
        rules: { 
            nombre: { 
                required: true, 
                minlength: 3,
                maxlength: 100,
                nombreReal: true 
            }, 
            codigo: { 
                required: true,
                minlength: 3,
                maxlength: 20,
                codigoMixto: true 
            },
            descripcion: {
                maxlength: 500
            },
            foto: {
                required: true,       // OBLIGATORIO: No permite guardar si está vacío
                extensionImagen: true // OBLIGATORIO: Bloquea archivos no permitidos como PDF
            }
        },
        messages: { 
            nombre: { 
                required: "Por favor, ingrese el nombre de la línea.",
                minlength: "Mínimo 3 caracteres.",
                maxlength: "Máximo 100 caracteres."
            }, 
            codigo: { 
                required: "Por favor, ingrese el código identificador."
            },
            descripcion: {
                maxlength: "La descripción no puede superar los 500 caracteres."
            },
            foto: {
                required: "La foto de la línea de ensamblaje es obligatoria.",
                extensionImagen: "Solo se aceptan archivos de imagen (.jpg, .png, .webp)."
            }
        },
        errorElement: 'label',
        errorClass: 'error text-danger fw-bold mt-1 d-block',
        highlight: function(element) {
            $(element).addClass('is-invalid error').removeClass('is-valid');
        },
        unhighlight: function(element) {
            $(element).removeClass('is-invalid error').addClass('is-valid');
        },
        errorPlacement: function(error, element) {
            if (element.attr("name") === "foto") {
                error.appendTo("#error-foto");
            } else {
                error.insertAfter(element);
            }
        }
    });
});
</script>
{% endblock %}
