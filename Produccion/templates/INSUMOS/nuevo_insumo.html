{% extends '../plantilla.html' %}
{% block contenido %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white"><h4 class="mb-0">Registrar Insumo</h4></div>
                <div class="card-body">
                    <form id="frm_insumo" action="{% url 'nuevo_insumo' %}" method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label"><b>Nombre del Insumo:</b></label>
                            <input type="text" class="form-control" name="nombre">
                        </div>
                        <div class="mb-3">
                            <label class="form-label"><b>Código de Referencia:</b></label>
                            <input type="text" class="form-control" name="codigo">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><b>Unidad de Medida:</b></label>
                                <select class="form-select" name="unidad_medida">
                                    <option value="Kg">Kilogramos</option>
                                    <option value="Mtrs">Metros</option>
                                    <option value="Unidades">Unidades</option>
                                    <option value="Ltrs">Litros</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><b>Stock Inicial:</b></label>
                                <input type="number" step="0.01" min="0" class="form-control" name="stock_disponible" value="0.00">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label"><b>Imagen del Insumo:</b></label>
                            <input type="file" id="foto_insumo" name="foto" accept="image/*">
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'listado_insumos' %}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar Insumo</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    $("#foto_insumo").fileinput({ language: 'es', showUpload: false, dropZoneEnabled: true, maxFileCount: 1 });
    $("#frm_insumo").validate({
        rules: { nombre: { required: true }, codigo: { required: true }, stock_disponible: { required: true, number: true, min: 0 } },
        messages: { stock_disponible: { min: "El stock no puede ser menor a 0" } }
    });
});
</script>
{% endblock %}
