{% extends '../plantilla.html' %}
{% block contenido %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-box-seam me-2"></i>Registrar Insumo / Materia Prima</h4>
                </div>
                <div class="card-body">
                    <form id="frm_insumo" action="{% url 'nuevo_insumo' %}" method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label"><b>Nombre del Insumo:</b></label>
                            <input type="text" class="form-control" name="nombre" placeholder="Ej: Polietileno de Alta Densidad, Hilo de Poliéster">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label"><b>Código de Referencia:</b></label>
                            <input type="text" class="form-control" name="codigo" value="{{ codigo_sugerido }}" placeholder="Ej: INS-001, COD-102">
                            <small class="text-muted">Se genera un código secuencial automático, o puede personalizarlo.</small>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><b>Unidad de Medida:</b></label>
                                <select class="form-select" name="unidad_medida">
                                    <option value="">-- Seleccione Unidad --</option>
                                    <option value="Kg">Kilogramos (Kg)</option>
                                    <option value="Mtrs">Metros (Mtrs)</option>
                                    <option value="Unidades">Unidades (Unid)</option>
                                    <option value="Ltrs">Litros (Ltrs)</option>
                                    <option value="Gramos">Gramos (g)</option>
                                    <option value="Rollos">Rollos</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><b>Stock Inicial Disponible:</b></label>
                                <input type="number" step="0.01" min="0" class="form-control" name="stock_disponible" value="0.00" placeholder="Ej: 150.50">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label"><b>Imagen / Fotografía del Insumo (Obligatorio):</b></label>
                            <input type="file" id="foto_insumo" name="foto" accept="image/jpeg,image/png,image/jpg,image/webp">
                            <div id="error-foto"></div>
                        </div>
                        
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'listado_insumos' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i>Guardar Insumo
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    // 1. Métodos personalizados de validación
    $.validator.addMethod("nombreReal", function(value, element) {
        var texto = $.trim(value);
        if (this.optional(element)) return true;
        // Solo letras y espacios (no números ni símbolos raros)
        if (!/^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/.test(texto)) return false;
        // Evita letras repetidas consecutivas excesivas (ej: aaaaaa)
        if (/(.)\1{3,}/.test(texto)) return false;
        // Debe tener mínimo 3 letras
        return (texto.replace(/\s/g, '').length >= 3);
    }, "Ingrese un nombre válido con letras variadas (sin números ni símbolos repetidos).");

    $.validator.addMethod("extensionImagen", function(value, element) {
        if (this.optional(element)) return true;
        return /\.(jpg|jpeg|png|webp)$/i.test(value);
    }, "Formato no permitido. Cargue únicamente archivos de imagen (.jpg, .png, .webp).");

    // 2. FileInput
    $("#foto_insumo").fileinput({
        language: 'es',
        showUpload: false,
        dropZoneEnabled: true,
        maxFileCount: 1,
        allowedFileTypes: ['image'],
        allowedFileExtensions: ["jpg", "jpeg", "png", "webp"]
    });

    $("#foto_insumo").on('fileloaded filecleared fileselecterror', function() {
        $(this).valid();
    });

    // 3. Validación de formulario
    $("#frm_insumo").validate({
        ignore: [],
        rules: {
            nombre: { 
                required: true, 
                minlength: 3,
                nombreReal: true 
            },
            codigo: { 
                required: true,
                minlength: 3
            },
            unidad_medida: { 
                required: true 
            },
            stock_disponible: { 
                required: true, 
                number: true, 
                min: 0 
            },
            foto: {
                required: true,       // OBLIGATORIO: No permite guardar si está vacío
                extensionImagen: true // OBLIGATORIO: Bloquea archivos no permitidos como PDF
            }
        },
        messages: {
            nombre: { 
                required: "Por favor, ingrese el nombre del insumo."
            },
            codigo: { 
                required: "El código de referencia es obligatorio."
            },
            unidad_medida: { 
                required: "Seleccione una unidad de medida."
            },
            stock_disponible: { 
                required: "Ingrese la cantidad inicial de stock.",
                number: "Ingrese un número válido.",
                min: "El stock no puede ser negativo."
            },
            foto: {
                required: "La fotografía del insumo es totalmente obligatoria.",
                extensionImagen: "Solo se aceptan archivos de imagen (.jpg, .png, .webp)."
            }
        },
        errorElement: 'label',
        errorClass: 'error text-danger fw-bold mt-1 d-block',
        highlight: function(element) {
            $(element).addClass('is-invalid error').removeClass('is-valid');
        },
        unhighlight: function(element) {
            $(element).removeClass('is-invalid error').addClass('is-valid');
        },
        errorPlacement: function(error, element) {
            if (element.attr("name") === "foto") {
                error.appendTo("#error-foto");
            } else {
                error.insertAfter(element);
            }
        }
    });
});
</script>
{% endblock %}
