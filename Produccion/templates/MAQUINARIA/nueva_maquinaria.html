{% extends '../plantilla.html' %}
{% load static %}

{% block contenido %}

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-cpu-fill me-2"></i>Registrar Maquinaria</h4>
                </div>
                <div class="card-body">
                    <form id="frm_maquinaria" action="{% url 'nueva_maquinaria' %}" method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <!-- Campo 1: Nombre de la Máquina -->
                        <div class="mb-3">
                            <label class="form-label" for="nombre"><b>Nombre de la Máquina:</b></label>
                            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej: Selladora Automática Industrial">
                        </div>

                        <!-- Campo 2: Código de Inventario (Generación Automática MAQ-001) -->
                        <div class="mb-3">
                            <label class="form-label" for="codigo_inventario"><b>Código de Inventario:</b></label>
                            <input type="text" class="form-control" id="codigo_inventario" name="codigo_inventario" value="{{ codigo_sugerido }}" placeholder="Ej: MAQ-001, MAQ-SEL-01">
                            <small class="text-muted">Se asigna automáticamente un código estándar (MAQ-001), o puede personalizarlo.</small>
                        </div>

                        <!-- Campo 3: Línea de Ensamblaje -->
                        <div class="mb-3">
                            <label class="form-label" for="linea_id"><b>Línea de Ensamblaje:</b></label>
                            <select class="form-select" id="linea_id" name="linea_id">
                                <option value="">-- Seleccione una Línea --</option>
                                {% for linea in lineas %}
                                    <option value="{{ linea.id }}">{{ linea.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Campo 4: Estado Inicial -->
                        <div class="mb-3">
                            <label class="form-label" for="estado"><b>Estado Inicial:</b></label>
                            <select class="form-select" id="estado" name="estado">
                                <option value="">-- Seleccione un Estado --</option>
                                <option value="Operativa" selected>Operativa</option>
                                <option value="En Mantenimiento">En Mantenimiento</option>
                                <option value="Detenida">Detenida</option>
                                <option value="Falla">Falla / Parada No Planificada</option>
                            </select>
                        </div>

                        <!-- Campo 5: Horas de Uso Acumuladas -->
                        <div class="mb-3">
                            <label class="form-label" for="horas_uso"><b>Horas de Uso Acumuladas:</b></label>
                            <input type="text" inputmode="numeric" class="form-control" id="horas_uso" name="horas_uso" value="0" maxlength="6">
                        </div>

                        <!-- Campo 6: Fotografía (Obligatoria) -->
                        <div class="mb-3">
                            <label class="form-label" for="foto_maquina"><b>Fotografía de la Máquina (Obligatorio):</b></label>
                            <input type="file" id="foto_maquina" name="foto" accept="image/jpeg,image/png,image/jpg,image/webp">
                            <div id="error-foto"></div>
                        </div>

                        <!-- Botones -->
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'listado_maquinarias' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i>Guardar Máquina
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {

    // 1. Reglas personalizadas
    $.validator.addMethod("extensionImagen", function(value, element) {
        if (this.optional(element)) return true;
        return /\.(jpg|jpeg|png|webp)$/i.test(value);
    }, "Solo se permiten imágenes (.jpg, .png, .webp). No se permiten archivos PDF u otros formatos.");

    $.validator.addMethod("nombreReal", function(value, element) {
        var texto = $.trim(value);
        if (this.optional(element)) return true;
        if (!/^[a-zA-Z0-9áéíóúÁÉÍÓÚñÑ\s\-\(\)]+$/.test(texto)) return false;
        if (!/[a-zA-ZáéíóúÁÉÍÓÚñÑ]/.test(texto)) return false;
        if (/^\d+$/.test(texto)) return false;
        if (/(.)\1{3,}/.test(texto)) return false;
        return true;
    }, "Ingrese un nombre de máquina válido que incluya letras legibles.");

    $.validator.addMethod("codigoMixto", function(value, element) {
        var cod = $.trim(value);
        if (this.optional(element)) return true;
        if (!/^[a-zA-Z0-9\-_]+$/.test(cod)) return false;
        return /[a-zA-Z]/.test(cod);
    }, "El código no puede ser solo ceros ni solo números (debe incluir letras).");

    $.validator.addMethod("soloNumerosEnteros", function(value, element) {
        if (this.optional(element)) return false;
        var num = parseInt(value, 10);
        return /^[0-9]+$/.test(value) && !isNaN(num) && num >= 0 && num <= 100000;
    }, "Ingrese una cantidad de horas válida (entre 0 y 100,000).");

    // Limpieza de inputs numéricos
    $("#horas_uso").on("input", function() {
        var val = this.value.replace(/[^0-9]/g, '');
        if (val.length > 1 && val.startsWith('0')) {
            val = parseInt(val, 10).toString();
            if (isNaN(val)) val = '0';
        }
        this.value = val;
    });

    // 2. FileInput
    $("#foto_maquina").fileinput({
        language: 'es',
        showUpload: false,
        dropZoneEnabled: true,
        maxFileCount: 1,
        allowedFileTypes: ['image'],
        allowedFileExtensions: ["jpg", "jpeg", "png", "webp"]
    });

    $("#foto_maquina").on('fileloaded filecleared fileselecterror', function() {
        $(this).valid();
    });

    // 3. Reglas de Validación
    $("#frm_maquinaria").validate({
        ignore: [],
        rules: {
            nombre: {
                required: true,
                minlength: 3,
                maxlength: 100,
                nombreReal: true
            },
            codigo_inventario: {
                required: true,
                minlength: 3,
                maxlength: 20,
                codigoMixto: true
            },
            linea_id: {
                required: true
            },
            estado: {
                required: true
            },
            horas_uso: {
                required: true,
                soloNumerosEnteros: true
            },
            foto: {
                required: true,       // OBLIGATORIO
                extensionImagen: true // Bloquea PDF
            }
        },
        messages: {
            nombre: {
                required: "El nombre de la máquina es obligatorio.",
                minlength: "El nombre debe tener al menos 3 caracteres."
            },
            codigo_inventario: {
                required: "El código de inventario es obligatorio."
            },
            linea_id: {
                required: "Por favor, seleccione una línea de ensamblaje."
            },
            estado: {
                required: "Por favor, seleccione el estado inicial de la máquina."
            },
            horas_uso: {
                required: "Las horas de uso son obligatorias."
            },
            foto: {
                required: "Debe seleccionar una fotografía de la máquina obligatoriamente.",
                extensionImagen: "Formato no permitido. Seleccione únicamente una imagen (.jpg, .png, .webp)."
            }
        },
        errorElement: 'label',
        errorClass: 'error text-danger fw-bold mt-1 d-block',
        highlight: function(element) {
            $(element).addClass('is-invalid error').removeClass('is-valid');
        },
        unhighlight: function(element) {
            $(element).removeClass('is-invalid error').addClass('is-valid');
        },
        errorPlacement: function(error, element) {
            if (element.attr("name") === "foto") {
                error.appendTo("#error-foto");
            } else {
                error.insertAfter(element);
            }
        }
    });
});
</script>

{% endblock %}
