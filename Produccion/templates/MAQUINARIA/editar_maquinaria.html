{% extends '../plantilla.html' %}
{% block contenido %}

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Editar Maquinaria</h4>
                </div>
                <div class="card-body">
                    <form id="frm_editar_maquinaria" action="{% url 'editar_maquinaria' maquinaria.id %}" method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <!-- Nombre de la máquina -->
                        <div class="mb-3">
                            <label for="nombre" class="form-label"><b>Nombre de la Máquina:</b> <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nombre" name="nombre" value="{{ maquinaria.nombre }}" placeholder="Ej: Torno CNC FX-500">
                        </div>

                        <!-- Código de inventario -->
                        <div class="mb-3">
                            <label for="codigo_inventario" class="form-label"><b>Código de Inventario:</b> <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="codigo_inventario" name="codigo_inventario" value="{{ maquinaria.codigo_inventario }}" placeholder="Ej: MAQ-001">
                        </div>

                        <!-- Línea de ensamblaje -->
                        <div class="mb-3">
                            <label for="linea_id" class="form-label"><b>Línea de Ensamblaje:</b> <span class="text-danger">*</span></label>
                            <select class="form-select" id="linea_id" name="linea_id">
                                <option value="">-- Seleccione una línea --</option>
                                {% for linea in lineas %}
                                    <option value="{{ linea.id }}" {% if maquinaria.linea.id == linea.id %}selected{% endif %}>{{ linea.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Estado -->
                        <div class="mb-3">
                            <label for="estado" class="form-label"><b>Estado Actual:</b> <span class="text-danger">*</span></label>
                            <select class="form-select" id="estado" name="estado">
                                <option value="">-- Seleccione el estado --</option>
                                <option value="Operativa" {% if maquinaria.estado == 'Operativa' %}selected{% endif %}>Operativa</option>
                                <option value="En Mantenimiento" {% if maquinaria.estado == 'En Mantenimiento' %}selected{% endif %}>En Mantenimiento</option>
                                <option value="Detenida" {% if maquinaria.estado == 'Detenida' %}selected{% endif %}>Detenida</option>
                                <option value="Falla" {% if maquinaria.estado == 'Falla' %}selected{% endif %}>Falla / Parada No Planificada</option>
                            </select>
                        </div>

                        <!-- Horas de uso -->
                        <div class="mb-3">
                            <label for="horas_uso" class="form-label"><b>Horas de Uso acumuladas:</b> <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="horas_uso" name="horas_uso" value="{{ maquinaria.horas_uso }}" placeholder="Ej: 100">
                        </div>

                        <!-- Carga de imagen -->
                        <div class="mb-3">
                            <label for="foto_maquina" class="form-label"><b>Fotografía (Actualizar/Reemplazar):</b> <span class="text-danger">*</span></label>
                            <input type="file" id="foto_maquina" name="foto" accept="image/jpeg,image/png,image/jpg,image/webp">
                            <div id="error-foto"></div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'listado_maquinarias' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-warning">
                                <i class="bi bi-check-circle me-1"></i>Actualizar Máquina
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {

    // 1. Reglas personalizadas
    $.validator.addMethod("nombreReal", function(value, element) {
        var texto = $.trim(value);
        if (this.optional(element)) return true;
        if (!/^[a-zA-Z0-9áéíóúÁÉÍÓÚñÑ\s\-\(\)]+$/.test(texto)) return false;
        if (!/[a-zA-ZáéíóúÁÉÍÓÚñÑ]/.test(texto)) return false;
        if (/^\d+$/.test(texto)) return false;
        if (/(.)\1{3,}/.test(texto)) return false;
        return true;
    }, "Ingrese un nombre de máquina válido.");

    $.validator.addMethod("codigoMixto", function(value, element) {
        var cod = $.trim(value);
        if (this.optional(element)) return true;
        if (!/^[a-zA-Z0-9\-_]+$/.test(cod)) return false;
        return /[a-zA-Z]/.test(cod);
    }, "El código no puede ser solo ceros ni solo números (debe contener letras).");

    $.validator.addMethod("extensionImagen", function(value, element) {
        {% if maquinaria.foto %}
        if (value === "") return true;
        {% endif %}
        return /\.(jpg|jpeg|png|webp)$/i.test(value);
    }, "Formato no permitido. Cargue únicamente archivos de imagen (.jpg, .png, .webp).");

    // 2. FileInput
    $("#foto_maquina").fileinput({
        language: 'es',
        showUpload: false,
        dropZoneEnabled: true,
        maxFileCount: 1,
        allowedFileTypes: ['image'],
        allowedFileExtensions: ["jpg", "jpeg", "png", "webp"],
        {% if maquinaria.foto %}
        initialPreview: ["<img src='{{ maquinaria.foto.url }}' class='kv-preview-data file-preview-image' style='max-width:100%; max-height:160px;'>"],
        initialPreviewAsData: false,
        {% endif %}
    });

    $("#foto_maquina").on('fileloaded filecleared fileselecterror', function() {
        $(this).valid();
    });

    // 3. Reglas de Validación
    $("#frm_editar_maquinaria").validate({
        ignore: [],
        rules: {
            nombre: {
                required: true,
                minlength: 3,
                maxlength: 100,
                nombreReal: true
            },
            codigo_inventario: {
                required: true,
                minlength: 3,
                maxlength: 20,
                codigoMixto: true
            },
            linea_id: {
                required: true
            },
            estado: {
                required: true
            },
            horas_uso: {
                required: true,
                number: true,
                min: 0,
                max: 100000
            },
            foto: {
                required: true,       // OBLIGATORIO
                extensionImagen: true // Bloquea PDF
            }
        },
        messages: {
            nombre: {
                required: "El nombre de la máquina es obligatorio.",
                minlength: "Debe ingresar al menos 3 caracteres."
            },
            codigo_inventario: {
                required: "El código de inventario es obligatorio."
            },
            linea_id: {
                required: "Debe seleccionar una línea de ensamblaje."
            },
            estado: {
                required: "Debe seleccionar el estado operativo de la máquina."
            },
            horas_uso: {
                required: "Las horas de uso son obligatorias.",
                min: "No se permiten valores negativos.",
                max: "El límite máximo permitido es 100,000 horas."
            },
            foto: {
                required: "Debe confirmar o reemplazar la fotografía de la máquina.",
                extensionImagen: "Solo se aceptan archivos de imagen (.jpg, .png, .webp)."
            }
        },
        errorElement: 'label',
        errorClass: 'error text-danger fw-bold mt-1 d-block',
        highlight: function(element) {
            $(element).addClass('is-invalid error').removeClass('is-valid');
        },
        unhighlight: function(element) {
            $(element).removeClass('is-invalid error').addClass('is-valid');
        },
        errorPlacement: function(error, element) {
            if (element.attr("name") === "foto") {
                error.appendTo("#error-foto");
            } else {
                error.insertAfter(element);
            }
        }
    });
});
</script>

{% endblock %}
