{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Iniciar Sesión - Industria Damaris</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/sweetalert/sweetalert2.min.css' %}" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Open Sans', sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
        }
        .login-header icon {
            font-size: 3rem;
            color: #0d6efd;
        }
        label.error { color: #dc3545; font-size: 12px; font-weight: bold; margin-top: 4px; display: block; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <i class="bi bi-gear-wide-connected display-4 text-primary"></i>
        <h3 class="fw-bold mt-2">Industria Damaris</h3>
        <p class="text-muted small">Acceso al Tablero de Control de Producción</p>
    </div>

    <form id="frm_login" action="{% url 'login' %}" method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-bold"><i class="bi bi-person me-1"></i>Usuario / Cédula:</label>
            <input type="text" class="form-control" name="username" placeholder="Ingrese su usuario o correo" required>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold"><i class="bi bi-lock me-1"></i>Contraseña:</label>
            <input type="password" class="form-control" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm mb-3">
            <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
        </button>

        <div class="text-center">
            <span class="text-muted small">¿Nuevo supervisor en la planta?</span>
            <a href="{% url 'registro' %}" class="fw-bold text-decoration-none">Registrarse aquí</a>
        </div>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
<script src="{% static 'vendor/jquery-validation/jquery.validate.min.js' %}"></script>
<script src="{% static 'vendor/sweetalert/sweetalert2.min.js' %}"></script>

<script>
$(document).ready(function() {
    $("#frm_login").validate({
        rules: {
            username: { required: true },
            password: { required: true }
        },
        messages: {
            username: { required: "Ingrese su nombre de usuario" },
            password: { required: "Ingrese su contraseña" }
        }
    });
});
</script>

{% if messages %}
    {% for mensaje in messages %}
        <script>
            Swal.fire({
                icon: '{% if "success" in mensaje.tags %}success{% else %}error{% endif %}',
                title: 'Mensaje del Sistema',
                text: '{{ mensaje }}',
                confirmButtonColor: '#0d6efd'
            });
        </script>
    {% endfor %}
{% endif %}

</body>
</html>
